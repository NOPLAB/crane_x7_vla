usim_sim_node:
  ros__parameters:
    # Simulator selection
    simulator: "maniskill"  # "maniskill" | "genesis" | "isaacsim"

    # Environment settings
    env_id: "PickPlace-CRANE-X7"
    robot_uid: "CRANE-X7"
    # Registered ManiSkill agent resolves its own downstream MJCF path.
    joint_names: [
      "crane_x7_shoulder_fixed_part_pan_joint",
      "crane_x7_shoulder_revolute_part_tilt_joint",
      "crane_x7_upper_arm_revolute_part_twist_joint",
      "crane_x7_upper_arm_revolute_part_rotate_joint",
      "crane_x7_lower_arm_fixed_part_joint",
      "crane_x7_lower_arm_revolute_part_joint",
      "crane_x7_wrist_joint",
      "crane_x7_gripper_finger_a_joint",
      "crane_x7_gripper_finger_b_joint"]
    arm_joint_names: [
      "crane_x7_shoulder_fixed_part_pan_joint",
      "crane_x7_shoulder_revolute_part_tilt_joint",
      "crane_x7_upper_arm_revolute_part_twist_joint",
      "crane_x7_upper_arm_revolute_part_rotate_joint",
      "crane_x7_lower_arm_fixed_part_joint",
      "crane_x7_lower_arm_revolute_part_joint",
      "crane_x7_wrist_joint"]
    gripper_joint_names: [
      "crane_x7_gripper_finger_a_joint",
      "crane_x7_gripper_finger_b_joint"]
    initial_qpos: [0.0, 0.39269908169872414, 0.0, -1.9634954084936207, 0.0, -0.7853981633974483, 1.5707963267948966, 0.0, 0.0]
    joint_stiffness: [1000.0, 1000.0, 1000.0, 1000.0, 1000.0, 1000.0, 1000.0, 1000.0, 1000.0]
    joint_damping: [100.0, 100.0, 100.0, 100.0, 100.0, 100.0, 100.0, 100.0, 100.0]
    # Legacy simulator limits; servo_envelope is an application profile.
    joint_force_limits: [10000.0, 10000.0, 10000.0, 10000.0, 10000.0, 10000.0, 10000.0, 10.0, 10.0]
    backend: "gpu"  # "cpu" | "gpu"
    render_mode: "rgb_array"  # "rgb_array" | "human" | "none"
    control_mode: "pd_joint_pos"  # "pd_joint_pos" | "pd_joint_delta_pos"

    # Simulation settings
    sim_rate: 30.0  # Hz
    max_episode_steps: 200
    auto_reset: true
    robot_init_qpos_noise: 0.02

    # Topic names (backward compatible with crane_x7_sim_maniskill)
    image_topic: "/camera/color/image_raw"
    joint_states_topic: "/joint_states"
    action_topic: "/vla/predicted_action"
    episode_done_topic: "/usim/episode_done"
    camera_frame: "hand_camera_link"
