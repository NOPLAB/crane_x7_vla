[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crane_x7_sim"
version = "0.1.0"
description = "CRANE-X7 robot simulation with unified simulator abstraction (lift)"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "nop" }]
keywords = ["robotics", "simulation", "maniskill", "genesis", "isaacsim"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.20.0",
]

[project.optional-dependencies]
maniskill = [
    "mani-skill>=3.0.0b20",
    "sapien",
    "torch>=1.10.0",
    "gymnasium>=0.26.0",
]
genesis = [
    "genesis-world",
    "torch>=2.0.0",
]
isaacsim = [
    # Isaac Sim dependencies are installed via Omniverse
]
all = [
    "crane_x7_sim[maniskill,genesis]",
]

[project.urls]
Repository = "https://github.com/nop/crane_x7_vla"

[tool.hatch.build.targets.wheel]
packages = ["src/lift", "src/lift_maniskill", "src/lift_genesis", "src/lift_isaacsim", "src/robot"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build]
include = [
    "src/**/*.py",
    "src/robot/assets/*.mjcf",
    "src/robot/assets/meshes/collision/*.stl",
    "src/robot/assets/meshes/visual/*.stl",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[tool.uv]
extra-index-url = ["https://download.pytorch.org/whl/cu128"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
