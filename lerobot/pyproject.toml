[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lerobot_robot_crane_x7"
version = "0.1.0"
description = "LeRobot integration for CRANE-X7 robot arm"
license = "MIT"
requires-python = ">=3.11,<3.14"
authors = [
    { name = "nop" }
]
keywords = ["robotics", "lerobot", "crane-x7", "dynamixel", "imitation-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "lerobot[dynamixel] @ git+https://github.com/huggingface/lerobot.git",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "pyrealsense2>=2.54.0",
    # Training dependencies
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "wandb>=0.15.0",
    "huggingface-hub>=0.20.0",
    # Utilities
    "tqdm>=4.65.0",
    "pyyaml>=6.0.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["lerobot_robot_crane_x7", "lerobot_teleoperator_crane_x7"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[tool.uv]
extra-index-url = ["https://download.pytorch.org/whl/cu128"]
index-strategy = "unsafe-best-match"
environments = ["python_version >= '3.11' and python_version < '3.14'"]
