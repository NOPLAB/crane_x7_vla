[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crane_x7_vla"
version = "0.1.0"
description = "Unified VLA training framework for CRANE-X7 robot"
license = "MIT"
requires-python = ">=3.10,<3.14"
authors = [{ name = "nop" }]
keywords = ["robotics", "vla", "crane-x7", "openvla", "minivla", "pi0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Transformers stack
    "transformers==4.57.3",
    "tokenizers==0.22.1",
    "timm==0.9.16",
    "sentencepiece==0.2.1",
    # Training and fine-tuning
    "peft>=0.13.0",
    "accelerate>=1.0.0",
    "bitsandbytes>=0.44.0",
    # Data processing
    "tfrecord>=1.14.0",
    "opencv-python-headless>=4.8.0",
    "Pillow>=10.0.0",
    "datasets>=2.21.0",
    "gymnasium>=1.0.0",
    "diffusers>=0.30.0",
    "av>=13.1.0",
    "imageio>=2.35.0",
    "deepdiff>=8.0.0",
    "termcolor>=2.4.0",
    # Utilities
    "einops>=0.7.0",
    "protobuf",
    "rich",
    "draccus==0.11.5",
    "json-numpy",
    "jsonlines>=4.0.0,<5.0.0",
    "PyYAML>=6.0",
    "safetensors>=0.4.0",
    # Monitoring
    "wandb>=0.16.0",
    "tqdm>=4.66.0",
    # Core
    "numpy>=1.24.0,<2.0.0",
    "torch>=2.0.0",
]

[project.optional-dependencies]
openvla = [
    "tensorflow>=2.15.0",
    "tensorflow-datasets>=4.9.0",
]
openpi = [
    "jax[cuda12]",
    "flax",
    "optax",
]

[project.scripts]
crane_x7_vla = "crane_x7_vla.training.cli:main"

[project.urls]
Homepage = "https://github.com/NOPLAB/crane_x7_vla"
Repository = "https://github.com/NOPLAB/crane_x7_vla"

[tool.hatch.build.targets.wheel]
packages = ["src/crane_x7_vla"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.8.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

[tool.uv]
extra-index-url = ["https://download.pytorch.org/whl/cu128"]
index-strategy = "unsafe-best-match"
override-dependencies = ["numpy>=1.24.0,<2.0.0"]
environments = ["python_version >= '3.10' and python_version < '3.14'"]

# =============================================================================
# Ruff Configuration (Linter & Formatter)
# =============================================================================
[tool.ruff]
target-version = "py310"
line-length = 120
indent-width = 4

exclude = [
    ".git",
    ".ruff_cache",
    ".mypy_cache",
    ".pytest_cache",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    ".venv",
    "venv",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
]

ignore = [
    "E501",   # Line too long (handled by formatter)
    "B008",   # Do not perform function call in argument defaults
    "B905",   # zip strict
    "ARG001", # Unused function argument (common in callbacks)
    "ARG002", # Unused method argument
]

fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["ARG001", "ARG002"]
"backends/pi0/models_pytorch/transformers_replace/*" = [
    "RUF012",
    "TC003",
    "ARG004",
    "E741",
    "UP038",
    "RUF005",
]

[tool.ruff.lint.isort]
known-first-party = ["crane_x7_vla"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

# =============================================================================
# Pyright/Pylance Configuration
# =============================================================================
[tool.pyright]
pythonVersion = "3.10"
pythonPlatform = "Linux"
typeCheckingMode = "basic"

include = ["."]
exclude = [
    "**/__pycache__",
    "**/build",
    "**/dist",
    "**/*.egg-info",
    ".venv",
    "venv",
]

reportMissingImports = "warning"
reportMissingTypeStubs = "none"
reportUnusedImport = "warning"
reportUnusedVariable = "warning"
reportUnusedFunction = "warning"
reportDuplicateImport = "warning"
reportOptionalMemberAccess = "warning"
reportOptionalSubscript = "warning"
reportPrivateUsage = "warning"
reportConstantRedefinition = "warning"
reportIncompatibleMethodOverride = "warning"
reportIncompatibleVariableOverride = "warning"
reportUntypedFunctionDecorator = "none"
reportUntypedClassDecorator = "none"
reportUntypedBaseClass = "none"
reportGeneralTypeIssues = "warning"

reportUnknownParameterType = "none"
reportUnknownArgumentType = "none"
reportUnknownLambdaType = "none"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"

# =============================================================================
# MyPy Configuration
# =============================================================================
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
strict_optional = true
show_error_codes = true
show_column_numbers = true

[[tool.mypy.overrides]]
module = [
    "tensorflow.*",
    "transformers.*",
    "torch.*",
    "PIL.*",
    "cv2.*",
    "wandb.*",
    "peft.*",
    "accelerate.*",
]
ignore_missing_imports = true

# =============================================================================
# Pytest Configuration
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "gpu: marks tests that require GPU",
]

# =============================================================================
# Coverage Configuration
# =============================================================================
[tool.coverage.run]
source = ["crane_x7_vla"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
